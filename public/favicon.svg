<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="tableGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="60%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </radialGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Table Felt Background -->
  <rect width="512" height="512" rx="110" fill="url(#tableGlow)" />
  <rect x="12" y="12" width="488" height="488" rx="98" fill="none" stroke="#78350f" stroke-width="12" opacity="0.6" />
  <rect x="24" y="24" width="464" height="464" rx="86" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.4" />

  <!-- Background Fan Card (Spades Ace) -->
  <g transform="translate(190, 240) rotate(-18) translate(-90, -130)" filter="url(#cardShadow)">
    <rect width="180" height="260" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3" />
    <text x="24" y="44" font-family="sans-serif" font-weight="900" font-size="28" fill="#0f172a">A</text>
    <text x="24" y="74" font-family="sans-serif" font-size="24" fill="#0f172a">♠</text>
    <text x="90" y="155" font-family="sans-serif" font-size="70" text-anchor="middle" fill="#0f172a">♠</text>
  </g>

  <!-- Foreground Main Card (Diamonds 9 - Бубновая Девятка!) -->
  <g transform="translate(290, 260) rotate(10) translate(-90, -130)" filter="url(#cardShadow)">
    <rect width="180" height="260" rx="18" fill="#ffffff" stroke="#fecdd3" stroke-width="3" />
    <text x="24" y="46" font-family="sans-serif" font-weight="900" font-size="32" fill="#e11d48">9</text>
    <text x="24" y="78" font-family="sans-serif" font-size="26" fill="#e11d48">♦</text>
    <text x="90" y="155" font-family="sans-serif" font-size="75" text-anchor="middle" fill="#e11d48">♦</text>
  </g>

  <!-- Golden Emblem Overlay "9" -->
  <circle cx="256" cy="400" r="54" fill="#09090b" stroke="url(#goldGradient)" stroke-width="6" filter="url(#cardShadow)" />
  <text x="256" y="426" font-family="sans-serif" font-weight="900" font-size="72" text-anchor="middle" fill="url(#goldGradient)">9</text>
</svg>
